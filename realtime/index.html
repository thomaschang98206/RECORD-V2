<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>及時資料處理 v1.0</title>
<style>
:root{
  --bg:#f2f2f2; --panel:#ffffff; --panel2:#e9e9e9; --ink:#161616; --muted:#767676;
  --line:#d9d9d9; --accent:#8a1f1f; --accent-ink:#ffffff; --good:#1f6b3a; --warn:#b26a00;
  --shadow:0 1px 4px rgba(0,0,0,.08); --radius:10px;
  --mono:'SFMono-Regular',Consolas,'Courier New',monospace;
  --sans:-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC',Segoe UI,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111111; --panel:#1b1b1b; --panel2:#262626; --ink:#f0f0f0; --muted:#9c9c9c;
    --line:#3a3a3a; --accent:#c9483a; --accent-ink:#111111; --good:#5fbf7f; --warn:#e0a040;
    --shadow:0 1px 8px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#111111; --panel:#1b1b1b; --panel2:#262626; --ink:#f0f0f0; --muted:#9c9c9c;
  --line:#3a3a3a; --accent:#c9483a; --accent-ink:#111111; --good:#5fbf7f; --warn:#e0a040;
  --shadow:0 1px 8px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent;}
body{padding-bottom:env(safe-area-inset-bottom);}
h1,h2,h3{margin:0 0 8px;font-weight:700;} h2{font-size:16px;} h3{font-size:13px;color:var(--muted);}
button{font-family:inherit;cursor:pointer;}
.app{max-width:1180px;margin:0 auto;padding:0 12px 60px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px;box-shadow:var(--shadow);}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.spacer{flex:1;}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:8px;padding:10px 14px;font-size:14px;font-weight:600;min-height:44px;}
.btn.small{padding:6px 10px;font-size:13px;min-height:36px;}
.btn.sel,.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.btn.ghost{background:transparent;}
.btn[disabled]{opacity:.35;pointer-events:none;}
.muted{color:var(--muted);font-size:12px;}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;background:var(--panel2);font-size:11px;color:var(--muted);border:1px solid var(--line);}
.tag.hot{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
input[type=text],input[type=number],select{padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font-size:16px;}
label.field{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);flex:1;min-width:120px;}
/* 頂部情境列 */
.sit{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0 6px;border-bottom:1px solid var(--line);margin-bottom:10px;}
.sit .l1{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.side{font-weight:800;padding:4px 10px;border-radius:6px;background:var(--accent);color:var(--accent-ink);font-size:14px;}
.side.def{background:var(--panel2);color:var(--ink);border:1px solid var(--line);}
.score{font-family:var(--mono);font-weight:800;font-size:20px;}
.pill{font-family:var(--mono);font-weight:800;font-size:18px;}
.outs i{display:inline-block;width:11px;height:11px;border-radius:50%;border:2px solid var(--muted);margin-right:3px;}
.outs i.on{background:var(--accent);border-color:var(--accent);}
.dia{width:34px;height:30px;position:relative;display:inline-block;}
.dia i{position:absolute;width:10px;height:10px;background:var(--panel2);border:2px solid var(--line);transform:rotate(45deg);}
.dia i.on{background:var(--accent);border-color:var(--accent);}
.dia .b1{right:1px;bottom:3px;} .dia .b2{left:11px;top:0;} .dia .b3{left:1px;bottom:3px;}
.sit .l2{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:14px;}
.sit .l2 b{font-size:15px;}
.sit .l3{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:12px;color:var(--muted);flex-wrap:wrap;}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:4px;}
.dot.off{background:var(--muted);} .dot.err{background:var(--accent);}
/* 分頁 */
.tabs{display:flex;gap:8px;margin-bottom:10px;}
.tabs .btn{flex:1;font-size:16px;min-height:50px;}
/* 球員按鈕 */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
.pbtn{text-align:left;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:10px;padding:10px;min-height:62px;}
.pbtn .pos{font-size:11px;color:var(--muted);} .pbtn .nm{font-size:16px;font-weight:700;} .pbtn .sub{font-size:12px;color:var(--muted);}
.pbtn.big{border-color:var(--accent);border-width:2px;}
/* 數據字卡 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
.stat{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px;}
.stat .k{font-size:12px;color:var(--muted);} .stat .v{font-family:var(--mono);font-size:24px;font-weight:800;margin:2px 0;}
.stat .a{font-size:12px;color:var(--muted);}
.stat.up .v{color:var(--good);} .stat.down .v{color:var(--accent);}
.alerts{list-style:none;padding:0;margin:0;}
.alerts li{padding:8px 10px;border-radius:8px;background:var(--panel2);margin-bottom:6px;font-size:15px;line-height:1.45;border-left:4px solid var(--line);}
.alerts li.bad{border-left-color:var(--accent);} .alerts li.ok{border-left-color:var(--good);} .alerts li.info{border-left-color:var(--muted);}
/* 進壘點熱圖 */
.zg{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;max-width:320px;margin:6px auto;}
.zc{aspect-ratio:1/1;border:1px solid var(--line);border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;font-weight:700;}
.zc small{font-size:9px;color:var(--muted);font-weight:400;}
.zc.in{border-color:var(--ink);} .zc.best{outline:3px solid var(--good);outline-offset:-3px;}
/* 排行榜 */
.rank{width:100%;border-collapse:collapse;font-size:14px;}
.rank td,.rank th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;}
.rank th{font-size:12px;color:var(--muted);font-weight:600;}
.rank .v{font-family:var(--mono);font-size:18px;font-weight:800;}
.rank tr.thin td{opacity:.45;}
.rank tr[data-act]{cursor:pointer;}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0;}
.chips .btn{min-height:38px;padding:6px 10px;font-size:13px;}
.modal-back{position:fixed;inset:0;background:rgba(10,10,10,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
@media(min-width:700px){.modal-back{align-items:center;}}
.modal{background:var(--panel);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px;border:1px solid var(--line);}
@media(min-width:700px){.modal{border-radius:16px;}}
.demo-btn{position:fixed;right:6px;bottom:4px;z-index:30;border:none;background:transparent;color:var(--muted);opacity:.22;font-size:10px;padding:4px;}
.demo-btn:hover{opacity:.6;}
.demobar{background:var(--warn);color:#111;border-radius:8px;padding:6px 10px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;}
.demobar .btn{min-height:34px;padding:4px 10px;font-size:13px;background:#fff;color:#111;border-color:#0003;}
.empty{text-align:center;padding:40px 10px;color:var(--muted);}
</style>
</head>

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function pct(x){ return x==null?'—':Math.round(x*100)+'%'; }
function defaultHand(name){ if(LEFT_LEFT.indexOf(name)>=0) return {throws:'L',bats:'L'}; if(RIGHT_LEFT.indexOf(name)>=0) return {throws:'R',bats:'L'}; return {throws:'R',bats:'R'}; }
function hz(h){ return h==='L'?'左':'右'; }

/* ================= 正規化：每一球一筆紀錄 ================= */
function teamPitcher(t){ if(!t) return null; return (t.lineup||[]).find(function(p){return p.pos==='P';}) || (t.pitcherId?(t.bench||[]).find(function(p){return p.id===t.pitcherId;}):null) || null; }
function ourSides(g){
  var o={};
  ['home','away'].forEach(function(sd){
    var t=g.teams[sd]||{}, nm=t.name||'';
    var hit=(t.lineup||[]).filter(function(p){return NCKU_NAMES.indexOf(p.name)>=0;}).length;
    if(/成大|我方|NCKU/i.test(nm) || hit>=4 || (g.sessionType==='liveBP')) o[sd]=true;
  });
  if(!o.home && !o.away) o.home=true;
  return o;
}
function handMap(g){
  var m={};
  ['home','away'].forEach(function(sd){ var t=g.teams[sd]||{}; (t.lineup||[]).concat(t.bench||[]).forEach(function(p){ if(p&&p.name) m[p.name]={bats:p.bats,throws:p.throws}; }); });
  return m;
}
function handOf(m,name,k){ var x=m[name]; if(x && (x[k]==='L'||x[k]==='R')) return x[k]; return defaultHand(name)[k]; }
function subSide(e){ return e.fieldingTeam || (e.halfBefore==='top'?'home':'away'); }
function baseCode(b){ b=b||{}; return (b[1]||b['1']?'1':'')+(b[2]||b['2']?'2':'')+(b[3]||b['3']?'3':''); }
function paOut(e){
  if(e.type==='pitch'){ var f=e.finalOutcome; if(f==='BB') return 'BB'; if(f==='HBP') return 'HBP'; if(f==='三振看'||f==='三振揮') return 'K'; return null; }
  var o=e.outcome; if(!o) return null;
  if(HITS.indexOf(o)>=0||o==='ROE'||o==='SF'||o==='SH') return o;
  return 'OUT';
}
function normGame(g){
  var our=ourSides(g), hand=handMap(g), recs=[], pc={}, bpa={}, cur={};
  var subs=g.events.filter(function(e){return e.type==='sub'&&e.kind==='投手更換';});
  ['home','away'].forEach(function(sd){
    var first=subs.find(function(e){return subSide(e)===sd&&e.outPlayerName;}), tp=teamPitcher(g.teams[sd]);
    cur[sd]=first?first.outPlayerName:(tp?tp.name:'');
  });
  g.events.forEach(function(e){
    if(e.type==='sub'&&e.kind==='投手更換'){ cur[subSide(e)]=e.inPlayerName; return; }
    if((e.type!=='pitch'&&e.type!=='battedball') || !e.fieldingTeam || !e.battingTeam) return;
    if(e.pitcherName) cur[e.fieldingTeam]=e.pitcherName;
    var pit=cur[e.fieldingTeam]||'', bat=e.batterName||'';
    pc[pit]=(pc[pit]||0)+1; if(!bpa[bat]) bpa[bat]=1;
    var end=e.type==='battedball'||!!e.finalOutcome||!!e.paEnd;
    var r={gid:g.id, date:g.date, pit:pit, pitT:e.pitcherThrows||handOf(hand,pit,'throws'), bat:bat, batB:e.batterBats||handOf(hand,bat,'bats'),
      ourPit:!!our[e.fieldingTeam], ourBat:!!our[e.battingTeam], inn:e.inningBefore||1, half:e.halfBefore, outs:e.outsBefore||0,
      bases:baseCode(e.basesBefore), b:e.ballsBefore||0, s:e.strikesBefore||0, pt:e.pitchType||'', zone:(e.zone==null?null:+e.zone),
      res:e.type==='battedball'?'inplay':e.pitchResult, paEnd:end, out:end?paOut(e):null, power:e.power||'', traj:e.trajectory||'',
      pc:pc[pit], bpa:bpa[bat], bp:g.sessionType==='liveBP'};
    if(end) bpa[bat]++;
    recs.push(r);
  });
  return {id:g.id, date:g.date, our:our, hand:hand, recs:recs};
}
function buildModel(){
  if(!S.cur){ S.model=null; return; }
  var cur=normGame(S.cur), hist=[];
  S.hist.forEach(function(g){ if(g && g.id!==S.cur.id && Array.isArray(g.events)) hist=hist.concat(normGame(g).recs); });
  S.model={cur:cur, today:cur.recs, hist:hist, all:hist.concat(cur.recs)};
}

/* ================= 指標 ================= */
function M(rs){
  var m={n:0,str:0,ball:0,swing:0,whiff:0,fps:0,fpsN:0,brk:0,brkStr:0,brkSw:0,brkWh:0,pa:0,k:0,bb:0,hbp:0,h:0,ab:0,sf:0,hard:0,bip:0};
  rs.forEach(function(r){
    m.n++; var st=r.res!=='ball'&&r.res!=='hbp'; if(st) m.str++; else m.ball++;
    var sw=r.res==='strike_swing'||r.res==='foul'||r.res==='inplay'; if(sw) m.swing++; if(r.res==='strike_swing') m.whiff++;
    if(r.b===0&&r.s===0){ m.fpsN++; if(st) m.fps++; }
    if(r.pt&&r.pt!=='直球'){ m.brk++; if(st) m.brkStr++; if(sw) m.brkSw++; if(r.res==='strike_swing') m.brkWh++; }
    if(r.res==='inplay'){ m.bip++; if(r.power==='強勁') m.hard++; }
    if(r.paEnd&&r.out){ var o=r.out; m.pa++; if(o==='K') m.k++; else if(o==='BB') m.bb++; else if(o==='HBP') m.hbp++;
      if(HITS.indexOf(o)>=0) m.h++; if(['BB','HBP','SF','SH'].indexOf(o)<0) m.ab++; if(o==='SF') m.sf++; }
  });
  return m;
}
var METRICS={
  strike:{l:'好球率',f:function(m){return [m.str,m.n];},hi:true,unit:'球'},
  ball:{l:'壞球率',f:function(m){return [m.ball,m.n];},hi:false,unit:'球'},
  whiff:{l:'揮空率',f:function(m){return [m.whiff,m.swing];},hi:true,unit:'揮棒'},
  swing:{l:'揮棒率',f:function(m){return [m.swing,m.n];},hi:true,unit:'球'},
  fps:{l:'首球好球率',f:function(m){return [m.fps,m.fpsN];},hi:true,unit:'打席'},
  brkStr:{l:'變化球好球率',f:function(m){return [m.brkStr,m.brk];},hi:true,unit:'球'},
  brkWhiff:{l:'變化球揮空率',f:function(m){return [m.brkWh,m.brkSw];},hi:true,unit:'揮棒'},
  obp:{l:'上壘率',f:function(m){return [m.h+m.bb+m.hbp,m.ab+m.bb+m.hbp+m.sf];},hi:true,unit:'打席'},
  avg:{l:'打擊率',f:function(m){return [m.h,m.ab];},hi:true,unit:'打數'},
  k:{l:'三振率',f:function(m){return [m.k,m.pa];},hi:false,unit:'打席'},
  bbr:{l:'四死率',f:function(m){return [m.bb+m.hbp,m.pa];},hi:false,unit:'打席'},
  hard:{l:'強勁擊球率',f:function(m){return [m.hard,m.bip];},hi:true,unit:'擊球'},
  contact:{l:'擊中率',f:function(m){return [m.swing-m.whiff,m.swing];},hi:true,unit:'揮棒'}
};
function R(m,key){ var x=METRICS[key].f(m); return {v:x[1]?x[0]/x[1]:null, n:x[1]}; }
var P_METRICS=['strike','whiff','fps','brkStr','brkWhiff','k','bbr','obp'];   /* 投手：obp 為被上壘率（低為佳） */
var B_METRICS=['obp','avg','whiff','contact','hard','k'];

/* ================= 目前情境 ================= */
function sideNames(g){ return {home:(g.teams.home||{}).name||'主隊', away:(g.teams.away||{}).name||'客隊'}; }
function situation(){
  var g=S.cur; if(!g) return null;
  var st=g.state||{}, bat=st.half==='top'?'away':'home', fld=bat==='away'?'home':'away';
  var our=S.model.cur.our, ourSide=our.away&&!our.home?'away':(our.home&&!our.away?'home':'home');
  if(our.away&&our.home) ourSide=fld;   /* 隊內賽：兩邊都是自己人，以守備方為「我方」 */
  var bt=g.teams[bat]||{lineup:[]}, idx=(st.battingIndex||{})[bat], batter=(idx!=null&&idx>=0)?bt.lineup[idx]:null;
  var pitcher=teamPitcher(g.teams[fld]);
  var sc={}; ['home','away'].forEach(function(sd){ sc[sd]=((st.score||{})[sd]||[]).reduce(function(a,b){return a+(b||0);},0); });
  var hand=S.model.cur.hand;
  return {g:g, st:st, batSide:bat, fldSide:fld, ourSide:ourSide, weBat:bat===ourSide, batter:batter, pitcher:pitcher,
    batB:batter?(batter.bats==='L'||batter.bats==='R'?batter.bats:handOf(hand,batter.name,'bats')):'R',
    pitT:pitcher?(pitcher.throws==='L'||pitcher.throws==='R'?pitcher.throws:handOf(hand,pitcher.name,'throws')):'R',
    bases:baseCode(st.bases), score:sc, names:sideNames(g)};
}
function baseCat(code){ if(!code) return 'empty'; if(code==='123') return 'loaded'; if(code.indexOf('2')>=0||code.indexOf('3')>=0) return 'risp'; return 'on'; }
var BASE_LBL={all:'全部壘況',empty:'空壘',on:'有人在壘',risp:'得點圈有人',loaded:'滿壘'};
function baseMatch(code,cat){ if(cat==='all') return true; if(cat==='empty') return !code; if(cat==='on') return !!code; if(cat==='risp') return /[23]/.test(code); if(cat==='loaded') return code==='123'; return true; }
function innMatch(i,c){ if(c==='all') return true; if(c==='1-3') return i<=3; if(c==='4-6') return i>=4&&i<=6; return i>=7; }

/* ================= 投手分析 ================= */
function bucketOf(pc){ return Math.min(5, Math.floor((pc-1)/15)); }
var BUCKET_LBL=['1–15','16–30','31–45','46–60','61–75','76+'];
function pitcherAnalysis(name){
  var md=S.model, today=md.today.filter(function(r){return r.pit===name;}), hist=md.hist.filter(function(r){return r.pit===name&&!r.bp;});
  var mt=M(today), mh=M(hist), out={name:name, today:today, hist:hist, mt:mt, mh:mh, notes:[]};
  var pcNow=today.length, games={}; hist.forEach(function(r){ games[r.gid]=Math.max(games[r.gid]||0,r.pc); });
  var gc=Object.keys(games).length; out.avgPitches=gc?Math.round(Object.keys(games).reduce(function(a,k){return a+games[k];},0)/gc):null; out.games=gc;
  /* 1. 壞球陡增的球數門檻 */
  var B=[0,1,2,3,4,5].map(function(){return [];}); hist.forEach(function(r){ B[bucketOf(r.pc)].push(r); });
  var base=M(B[0].concat(B[1])), baseBall=base.n>=15?base.ball/base.n:null, thr=null;
  if(baseBall!=null) for(var k=2;k<6;k++){ var mk=M(B[k]); if(mk.n>=10 && mk.ball/mk.n>=baseBall+0.10){ thr={from:k*15+1, before:baseBall, after:mk.ball/mk.n, n:mk.n}; break; } }
  var maxPc=hist.reduce(function(a,r){return Math.max(a,r.pc);},0);
  if(thr){
    if(pcNow>=thr.from) out.notes.push({c:'bad',t:'⚠ 已到第 '+thr.from+' 球後的「壞球變多」區：平常 '+pct(thr.before)+' → '+pct(thr.after)});
    else out.notes.push({c:'info',t:'第 '+thr.from+' 球後壞球會變多（'+pct(thr.before)+' → '+pct(thr.after)+'），還差 '+(thr.from-pcNow)+' 球'});
    /* 影響：過門檻後被上壘率 */
    var before=M(hist.filter(function(r){return r.pc<thr.from;})), after=M(hist.filter(function(r){return r.pc>=thr.from;}));
    var ob=R(before,'obp'), oa=R(after,'obp');
    if(ob.n>=4&&oa.n>=4){ var d=oa.v-ob.v; out.notes.push({c:d>=0.10?'bad':(d<=0.05?'ok':'info'), t:'過了這個球數被上壘率 '+pct(ob.v)+' → '+pct(oa.v)+'：'+(d>=0.10?'影響大':(d<=0.05?'影響不大':'有些影響'))+'（'+oa.n+' 打席）'}); }
  } else if(baseBall==null || maxPc<31) out.notes.push({c:'info',t:'歷史球數不足（最多投到 '+maxPc+' 球），還判斷不出球數門檻'});
  else out.notes.push({c:'ok',t:'歷史上投到 '+maxPc+' 球，壞球率沒有明顯陡增'});
  /* 2. 揮空率下降點 */
  var baseW=base.swing>=8?base.whiff/base.swing:null;
  if(baseW!=null) for(var j=2;j<6;j++){ var mj=M(B[j]); if(mj.swing>=6 && mj.whiff/mj.swing<=baseW-0.12){ out.notes.push({c:pcNow>=j*15+1?'bad':'info', t:(pcNow>=j*15+1?'⚠ ':'')+'第 '+(j*15+1)+' 球後揮空率會掉（'+pct(baseW)+' → '+pct(mj.whiff/mj.swing)+'）'}); break; } }
  /* 3. 今天 vs 平常 */
  if(mt.n>=10 && mh.n>=20){
    var tb=mt.ball/mt.n, hb=mh.ball/mh.n;
    if(tb-hb>=0.08) out.notes.push({c:'bad',t:'今天壞球比平常多：'+pct(tb)+'（平常 '+pct(hb)+'）'});
    else if(hb-tb>=0.08) out.notes.push({c:'ok',t:'今天控球比平常好：壞球率 '+pct(tb)+'（平常 '+pct(hb)+'）'});
    var tw=R(mt,'whiff'), hw=R(mh,'whiff');
    if(tw.n>=6 && hw.v!=null && hw.v-tw.v>=0.12) out.notes.push({c:'bad',t:'今天揮空率偏低：'+pct(tw.v)+'（平常 '+pct(hw.v)+'）'});
  }
  if(!hist.length) out.notes.unshift({c:'info',t:'沒有這位投手的歷史資料，只顯示今天'});
  return out;
}
/* 情境進壘點：這個情境丟哪裡最能拿到好球 */
function zoneAdvice(name, sit){
  var pool=S.model.all.filter(function(r){return r.pit===name && r.zone!=null;});
  var cat=baseCat(sit.bases), hl=hz(sit.batB)+'打';
  var levels=[
    {l:BASE_LBL[cat]+'・對'+hl, f:function(r){return baseMatch(r.bases,cat)&&r.batB===sit.batB;}},
    {l:'對'+hl, f:function(r){return r.batB===sit.batB;}},
    {l:BASE_LBL[cat], f:function(r){return baseMatch(r.bases,cat);}},
    {l:'全部情境', f:function(){return true;}}
  ];
  var pick=null;
  for(var i=0;i<levels.length;i++){ var rs=pool.filter(levels[i].f); if(rs.length>=20 || i===levels.length-1){ pick={l:levels[i].l, rs:rs, fallback:i>0}; break; } }
  var cells=[]; for(var z=0;z<25;z++) cells.push({n:0,s:0});
  pick.rs.forEach(function(r){ var c=cells[r.zone]; if(!c) return; c.n++; if(r.res!=='ball'&&r.res!=='hbp') c.s++; });
  var ranked=cells.map(function(c,i){return {i:i,n:c.n,v:c.n?c.s/c.n:0};}).filter(function(c){return c.n>=3;}).sort(function(a,b){return b.v-a.v||b.n-a.n;});
  var best={}; ranked.slice(0,3).forEach(function(c){ best[c.i]=1; });
  /* 球種 */
  var types={}; pick.rs.forEach(function(r){ var k=r.pt||'未記'; types[k]=types[k]||{n:0,s:0}; types[k].n++; if(r.res!=='ball'&&r.res!=='hbp') types[k].s++; });
  var tbest=Object.keys(types).filter(function(k){return k!=='未記'&&types[k].n>=5;}).sort(function(a,b){return types[b].s/types[b].n-types[a].s/types[a].n;})[0];
  return {label:pick.l, n:pick.rs.length, fallback:pick.fallback, cells:cells, best:best, top:ranked[0], tbest:tbest?{k:tbest,v:types[tbest].s/types[tbest].n,n:types[tbest].n}:null};
}

/* ================= 打者分析 ================= */
function batterAnalysis(name, sit){
  var md=S.model, today=md.today.filter(function(r){return r.bat===name;}), hist=md.hist.filter(function(r){return r.bat===name;});
  var mt=M(today), mh=M(hist), out={name:name, today:today, hist:hist, mt:mt, mh:mh, notes:[]};
  var tw=R(mt,'whiff'), hw=R(mh,'whiff');
  if(tw.n>=3 && hw.v!=null){
    if(tw.v-hw.v>=0.15) out.notes.push({c:'bad',t:'⚠ 今天揮空明顯偏高：'+pct(tw.v)+'（平常 '+pct(hw.v)+'）'});
    else out.notes.push({c:'info',t:'今天揮空率 '+pct(tw.v)+'（平常 '+pct(hw.v)+'）'});
  }
  /* 揮空偏高的比賽，表現會不會變差 */
  var byG={}; hist.forEach(function(r){ (byG[r.gid]=byG[r.gid]||[]).push(r); });
  var hi=[], lo=[];
  Object.keys(byG).forEach(function(k){ var m=M(byG[k]); if(m.swing<4) return; var w=m.whiff/m.swing; (w>(hw.v||0)?hi:lo).push(m); });
  function pool(arr){ var t={h:0,bb:0,hbp:0,ab:0,sf:0}; arr.forEach(function(m){ t.h+=m.h; t.bb+=m.bb; t.hbp+=m.hbp; t.ab+=m.ab; t.sf+=m.sf; }); var d=t.ab+t.bb+t.hbp+t.sf; return d?(t.h+t.bb+t.hbp)/d:null; }
  if(hi.length&&lo.length){ var a=pool(hi), b=pool(lo); if(a!=null&&b!=null){ var d=b-a;
    out.notes.push({c:d>=0.15?'bad':(d<=0.05?'ok':'info'), t:'揮空多的比賽上壘率 '+pct(a)+'（'+hi.length+'場）vs 其他 '+pct(b)+'（'+lo.length+'場）：'+(d>=0.15?'揮空多就容易打不好':(d<=0.05?'影響不大':'稍微受影響'))}); } }
  else if(Object.keys(byG).length<2) out.notes.push({c:'info',t:'比賽場數不足，還看不出揮空和表現的關係'});
  /* 對目前投手左右 */
  if(sit){ var vs=M(hist.concat(today).filter(function(r){return r.pitT===sit.pitT;})), o=R(vs,'obp');
    out.notes.push({c:'info',t:'對'+hz(sit.pitT)+'投上壘率 '+pct(o.v)+'（'+o.n+' 打席）'}); }
  if(!hist.length) out.notes.unshift({c:'info',t:'沒有這位打者的歷史資料，只顯示今天'});
  return out;
}
function todayLine(name){
  var rs=S.model?S.model.today.filter(function(r){return r.bat===name&&r.paEnd&&r.out;}):[], m=M(rs);
  var marks=rs.map(function(r){return {K:'三振',BB:'保送',HBP:'觸身',SF:'犧飛',SH:'犧觸',ROE:'失誤上',OUT:'出局'}[r.out]||r.out;});
  return {txt:m.ab+' 之 '+m.h, marks:marks, pa:rs.length};
}

function render(){
  var a=document.getElementById('app'), h='';
  if(!S.cur){ h=renderEmpty(); }
  else {
    var sit=situation();

function ranking(sub,mkey,bc,inn,hand,x){
  var md=S.model, names={}, out=[];
  md.all.forEach(function(r){ if(sub==='pitcher'?r.ourPit:r.ourBat) names[sub==='pitcher'?r.pit:r.bat]=1; });
  var ourLu=((x.g.teams[x.ourSide]||{}).lineup||[]).map(function(p){return p.name;});
  Object.keys(names).filter(Boolean).forEach(function(n){
    var rs=md.all.filter(function(r){ if(sub==='pitcher'){ if(r.pit!==n) return false; if(hand!=='all'&&r.batB!==hand) return false; } else { if(r.bat!==n) return false; if(hand!=='all'&&r.pitT!==hand) return false; }
      return baseMatch(r.bases,bc)&&innMatch(r.inn,inn); });
    var m=M(rs), q=R(m,mkey), unitKey=METRICS[mkey].unit;
    var thin=sub==='pitcher'?(m.n<15||q.n<3):(m.pa<3||q.n<3);
    var tags=[], ht=md.hand;
    if(sub==='pitcher'){ if(x.pitcher&&x.pitcher.name===n) tags.push({t:'投球中',hot:true}); var tp=md.today.filter(function(r){return r.pit===n;}).length; if(tp) tags.push({t:'今天 '+tp+' 球'}); }
    else { if(x.batter&&x.batter.name===n) tags.push({t:'打擊中',hot:true}); tags.push({t:ourLu.indexOf(n)>=0?'在場上':'板凳'}); }
    var anyR=md.all.find(function(r){return sub==='pitcher'?r.pit===n:r.bat===n;});
    out.push({name:n, v:q.v, n:q.n, unit:unitKey, thin:thin||q.v==null, tags:tags, hand:anyR?(sub==='pitcher'?anyR.pitT:anyR.batB):'R',
      extra:sub==='pitcher'?(pct(R(m,'whiff').v)+' / '+pct(R(m,'obp').v)):(pct(R(m,'whiff').v)+' / '+pct(R(m,'hard').v))});
  });
  var hi=(sub==='pitcher'&&mkey==='obp')?false:METRICS[mkey].hi;
  out.sort(function(a,b){ if(a.thin!==b.thin) return a.thin?1:-1; if(a.v==null) return 1; if(b.v==null) return -1; return hi?b.v-a.v:a.v-b.v; });
  return out;
}

/* ================= 資料來源：雲端即時 / 本機檔案 ================= */
function api(params){
  var u=S.cfg.url; var q=Object.keys(params).map(function(k){return k+'='+encodeURIComponent(params[k]);}).join('&');
  return fetch(u+(u.indexOf('?')>=0?'&':'?')+q+'&token='+encodeURIComponent(S.cfg.token||'')).then(function(r){return r.text();}).then(function(t){
    var o; try{ o=JSON.parse(t); }catch(e){ throw new Error('回應不是 JSON'); } if(!o.ok) throw new Error(o.error||'失敗'); return o; });
}
function startLive(){
  stopLive(); if(!S.cfg.url) return;
  S.mode='live'; S.liveStatus={t:null,err:null};
  try{ var c=JSON.parse(localStorage.getItem(HIST_KEY)||'null'); if(c&&Array.isArray(c.games)) S.hist=c.games; }catch(e){}
  api({action:'history'}).then(function(o){ S.hist=o.games||[]; try{ localStorage.setItem(HIST_KEY, JSON.stringify({t:Date.now(),games:S.hist})); }catch(e){} buildModel(); render(); }).catch(function(e){ S.liveStatus.err='歷史：'+e.message; render(); });
  pollOnce(); S.pollTimer=setInterval(pollOnce, Math.max(3,+S.cfg.poll||5)*1000);
}
function stopLive(){ if(S.pollTimer){ clearInterval(S.pollTimer); S.pollTimer=null; } }
function pollOnce(){
  if(S.mode!=='live'||S.liveStatus.busy) return; S.liveStatus.busy=true;
  var pick=S.cfg.gameId&&S.cfg.gameId!=='auto'?Promise.resolve(S.cfg.gameId):api({action:'list'}).then(function(o){
    S.gameList=o.games||[]; var g=S.gameList.find(function(x){return !x.finished;})||S.gameList[0]; if(!g) throw new Error('雲端還沒有任何比賽'); return g.gameId; });
  pick.then(function(id){ return api({action:'latest',gameId:id}); }).then(function(o){
    var g=o.game, changed=!S.cur||S.cur.id!==g.id||S.cur.events.length!==g.events.length||S.cur.updatedAt!==g.updatedAt;
    S.liveStatus.t=Date.now(); S.liveStatus.err=null;
    if(changed){ S.cur=g; buildModel(); }
    if(!S.modal) render();
  }).catch(function(e){ S.liveStatus.err=e.message; if(!S.modal) render(); }).then(function(){ S.liveStatus.busy=false; });
}
function readFiles(files,cb){
  var arr=[], left=files.length; if(!left){ cb(arr); return; }
  Array.prototype.forEach.call(files,function(f){ var r=new FileReader(); r.onload=function(){ try{ var o=JSON.parse(String(r.result||'')); if(o.db&&o.db.games) Object.keys(o.db.games).forEach(function(k){arr.push(o.db.games[k]);}); else if(o.events) arr.push(o); }catch(e){} if(--left===0) cb(arr); }; r.readAsText(f); });
}
function openSettings(){
  var c=S.cfg;
  S.modal='<h2>設定</h2>'+
    '<h3>雲端即時（Google Apps Script）</h3><div class="row"><label class="field" style="flex:3">網址<input type="text" id="cf-url" value="'+esc(c.url||'')+'" placeholder="https://script.google.com/macros/s/…/exec"></label><label class="field">密碼<input type="text" id="cf-token" value="'+esc(c.token||'')+'"></label></div>'+
    '<div class="row" style="margin-top:6px"><label class="field">比賽<select id="cf-game"><option value="auto">自動（最新一場進行中）</option>'+S.gameList.map(function(g){return '<option value="'+esc(g.gameId)+'"'+(c.gameId===g.gameId?' selected':'')+'>'+esc((g.date||'')+' '+(g.title||''))+(g.finished?'（已結束）':'')+'</option>';}).join('')+'</select></label>'+
    '<label class="field" style="max-width:120px">更新間隔（秒）<input type="number" id="cf-poll" value="'+(c.poll||5)+'" min="3"></label></div>'+
    '<div class="row" style="margin-top:8px"><button class="btn primary" data-act="cfgSave">儲存並連線</button><button class="btn small" data-act="cfgList">讀取比賽清單</button></div><hr>'+
    '<h3>本機檔案（沒有網路時）</h3><div class="row"><button class="btn small" data-act="fileCur">載入目前比賽 JSON</button><button class="btn small" data-act="fileHist">加入歷史比賽 JSON（可多選）</button><button class="btn small" data-act="histClear">清除歷史（'+S.hist.length+' 場）</button></div>'+
    '<input type="file" id="f-cur" accept=".json,application/json" class="hidden" style="display:none"><input type="file" id="f-hist" accept=".json,application/json" multiple style="display:none">'+
    '<p class="muted">歷史比賽也接受「完整備份」JSON。Live BP 的資料只用於投球品質（好球率、揮空率），不計入打擊結果。</p>'+
    '<div class="row" style="margin-top:12px"><span class="muted">v'+APP_VERSION+'</span><span class="spacer"></span><button class="btn" data-act="closeModal">關閉</button></div>';
  render();
}

/* ================= DEMO（只在按下 DEMO 時載入內嵌資料） ================= */
var DEMO_RAW=null;
function demoData(){ if(!DEMO_RAW){ try{ DEMO_RAW=JSON.parse(document.getElementById('demo-data').textContent); }catch(e){ DEMO_RAW=null; } } return DEMO_RAW; }
function startDemo(){
  var d=demoData(); if(!d){ alert('這個版本沒有內嵌 DEMO 資料'); return; }
  stopLive(); S.mode='demo'; S.demo={i:0, frames:d.frames}; S.hist=d.hist; applyDemoFrame();
}
function applyDemoFrame(){
  var d=demoData(), fr=S.demo.frames[S.demo.i], g=JSON.parse(JSON.stringify(d.base));
  for(var k=0;k<=S.demo.i;k++){ var f=S.demo.frames[k]; (f.events||[]).forEach(function(e){ g.events.push(e); }); if(f.teams) g.teams=JSON.parse(JSON.stringify(f.teams)); }
  g.state=fr.state; S.cur=g; buildModel();
  if(fr.view){ S.view.tab=fr.view.tab||S.view.tab; S.view.page=fr.view.page||null; if(fr.view.sub) S.view.sub=fr.view.sub; S.view.fBases='auto'; S.view.fHand='auto'; S.view.fInn='all'; }
  S.modal=null; render(); window.scrollTo(0,0);
}
function exitDemo(){ S.mode='none'; S.demo=null; S.cur=null; S.hist=[]; S.model=null; S.view.page=null; if(S.cfg.url) startLive(); render(); }

/* ================= 事件 ================= */
document.body.addEventListener('click',function(ev){
  if(ev.target.id==='demo-btn'){ startDemo(); return; }
  var t=ev.target.closest('[data-act]'); if(!t) return;
  var a=t.dataset.act, v=S.view;
  switch(a){
    case 'tab': v.tab=t.dataset.v; v.page=null; render(); break;
    case 'sub': v.sub=t.dataset.v; v.fHand='auto'; render(); break;
    case 'adv': v.adv=!v.adv; render(); break;
    case 'filt': v[t.dataset.k]=t.dataset.v; render(); break;
    case 'metric': if(v.sub==='pitcher') v.metricP=t.dataset.v; else v.metricB=t.dataset.v; render(); break;
    case 'open': v.page={name:t.dataset.name, role:t.dataset.role}; render(); window.scrollTo(0,0); break;
    case 'openPick': { var sel=document.getElementById('pick-any'); if(sel&&sel.value){ var p=sel.value.split('|'); v.page={role:p[0],name:p.slice(1).join('|')}; render(); window.scrollTo(0,0);} break; }
    case 'back': v.page=null; render(); break;
    case 'settings': openSettings(); break;
    case 'closeModal': S.modal=null; render(); break;
    case 'cfgSave': S.cfg.url=document.getElementById('cf-url').value.trim(); S.cfg.token=document.getElementById('cf-token').value.trim(); S.cfg.gameId=document.getElementById('cf-game').value; S.cfg.poll=+document.getElementById('cf-poll').value||5; saveCfg(); S.modal=null; if(S.mode!=='demo') startLive(); render(); break;
    case 'cfgList': S.cfg.url=document.getElementById('cf-url').value.trim(); S.cfg.token=document.getElementById('cf-token').value.trim(); api({action:'list'}).then(function(o){ S.gameList=o.games||[]; openSettings(); }).catch(function(e){ alert('讀取失敗：'+e.message); }); break;
    case 'fileCur': document.getElementById('f-cur').click(); break;
    case 'fileHist': document.getElementById('f-hist').click(); break;
    case 'histClear': S.hist=[]; try{ localStorage.removeItem(HIST_KEY); }catch(e){} buildModel(); openSettings(); break;
    case 'demoNext': if(S.demo.i<S.demo.frames.length-1){ S.demo.i++; applyDemoFrame(); } break;
    case 'demoPrev': if(S.demo.i>0){ S.demo.i--; applyDemoFrame(); } break;
    case 'demoExit': exitDemo(); break;
  }
});
document.body.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='f-cur'){ readFiles(t.files,function(arr){ var g=arr.find(function(x){return x&&x.events&&x.state;}); if(!g){ alert('不是比賽 JSON'); return; } stopLive(); S.mode='file'; S.cur=g; buildModel(); S.modal=null; render(); }); t.value=''; }
  if(t.id==='f-hist'){ readFiles(t.files,function(arr){ var ids={}; S.hist.forEach(function(g){ids[g.id]=1;}); arr.forEach(function(g){ if(g&&g.id&&!ids[g.id]){ S.hist.push(g); ids[g.id]=1; } }); buildModel(); openSettings(); }); t.value=''; }
});

if(S.cfg.url) startLive();
render();
})();
</script>
